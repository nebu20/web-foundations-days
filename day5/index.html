
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
  </head>

  <body>
    <header>
      <h1>User Directory</h1>
      <p>Load and search users from an API.</p>
    </header>

    <main>
      <section aria-labelledby="users-heading">
        <h2 id="users-heading">Users</h2>

        <button type="button" id="load-users">Load Users</button>

        <div>
          <label for="filter-input">Filter users by name</label>
          <input
            type="text"
            id="filter-input"
            name="filter"
            placeholder="Type a name to search..."
          />
        </div>

        <p id="status" role="status" aria-live="polite">
          Click "Load Users" to retrieve users.
        </p>

        <ul id="users-list"></ul>
      </section>
    </main>

    <footer>
      <p>Web Foundations - Day 5 Assignment</p>
    </footer>
  </body>
</html>
